name: Refresh government updates

on:
  push:
    branches:
      - main
    paths-ignore:
      - "data/**"
  schedule:
    # 政府省庁の更新頻度に合わせて1日1回（22:17 UTC ＝ 日本時間 翌07:17）。
    # 3時間毎に回していた時期の実績: 7日間で87回実行し、記事の増減があったのは2回だけで、
    # 残りはタイムスタンプだけが変わる差分だった。急ぎで取り込みたい場合は workflow_dispatch。
    - cron: "17 22 * * *"
  workflow_dispatch:

concurrency:
  group: refresh-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest
      - name: Fetch official feeds
        run: uv run python scripts/fetch_feeds.py
      - name: Cache local model
        uses: actions/cache@v4
        with:
          path: ~/.cache/llama.cpp
          key: llama-model-llm-jp-3-1-1-8b-q4
      - name: Install llama.cpp
        continue-on-error: true
        run: |
          set -e
          release_json="$(curl --retry 3 --retry-delay 2 -fsSL -H 'User-Agent: gov-sci-tech-watcher/1.0' https://api.github.com/repos/ggml-org/llama.cpp/releases/latest)"
          asset_url="$(printf '%s' "$release_json" | jq -r '.assets[] | select(.name | test("ubuntu-x64\\.tar\\.gz$")) | .browser_download_url' | head -n 1)"
          if [ -z "$asset_url" ] || [ "$asset_url" = "null" ]; then
            echo "Could not find a CPU binary for llama.cpp; the refresh will keep fallback summaries."
            exit 0
          fi
          llama_dir="$RUNNER_TEMP/llama"
          mkdir -p "$llama_dir"
          curl --retry 3 --retry-delay 2 -fL -H 'User-Agent: gov-sci-tech-watcher/1.0' "$asset_url" -o "$RUNNER_TEMP/llama.tar.gz"
          tar -xzf "$RUNNER_TEMP/llama.tar.gz" -C "$llama_dir"
          llama_bin="$(find "$llama_dir" -type f -name llama-cli -print -quit)"
          if [ -n "$llama_bin" ]; then
            chmod +x "$llama_bin"
            dirname "$llama_bin" >> "$GITHUB_PATH"
          else
            echo "llama-cli was not found in the downloaded archive."
          fi
      - name: Generate cached local summaries
        run: uv run python scripts/summarize_updates.py --max-items 1 --timeout 600
      - name: Build policy and reality analytics
        run: uv run python scripts/build_analytics.py
      - name: Commit refreshed data
        run: |
          git config user.name "gov-sci-tech-watcher[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/updates.json data/summary_cache.json data/analytics.json
          git diff --cached --quiet || git commit -m "chore: refresh government updates"
          # 手動プッシュとcronが数秒差で競合すると非fast-forwardで落ちるため、
          # リベースして最大3回まで再試行する（データ更新コミットは常に安全にリベース可能）
          for attempt in 1 2 3; do
            git push && break
            echo "push rejected (attempt $attempt); rebasing onto latest main"
            git pull --rebase origin main
          done
      - name: Deploy updated site to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets are not configured; keeping the existing deployment."
            exit 0
          fi
          npm ci
          publish_dir="$RUNNER_TEMP/science-signal-site"
          mkdir -p "$publish_dir/data"
          cp index.html analytics.html analytics.css obs-core.js hub.js signals.html signals.js people.html people.js papers.html papers.js money.html money.js gov.html gov.js policy.html policy.js _headers _redirects "$publish_dir/"
          cp data/updates.json data/analytics.json data/indicators.json data/finance.json data/publishing.json data/topics.json data/scisci.json data/funders.json data/economy.json data/phd_support.json data/gov.json data/policy.json data/mobility.json data/land-110m.json "$publish_dir/data/"
          npx wrangler pages deploy "$publish_dir" --project-name science-signal --branch main --commit-message "refresh government updates"
